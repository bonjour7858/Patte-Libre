<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopt'SPA - Recherche Indépendante</title>
    <!-- Tailwind CSS pour le design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Votre fichier CSS personnalisé -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 font-sans flex flex-col min-h-screen">

    <!-- En-tête -->
    <header class="bg-indigo-600 text-white py-6 shadow-md">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold">🐾 Adopt'SPA</h1>
            <p class="text-indigo-200 mt-1">Plateforme de recherche indépendante</p>
        </div>
    </header>

    <!-- Mention légale obligatoire -->
    <div class="bg-amber-100 border-b border-amber-200 py-3 px-4 text-center">
        <p class="text-sm text-amber-900 font-medium">
            ⚠️ <strong>Avertissement :</strong> Ce site n'est en AUCUN cas un site officiel de la SPA.
        </p>
    </div>

    <!-- Grille des animaux -->
    <main class="container mx-auto px-4 py-8 flex-grow">
        <div id="animaux-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Les cartes seront injectées ici par JavaScript -->
        </div>
    </main>

    <!-- Pop-up (Modal) -->
    <div id="modal" class="modal-hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl relative">
            <button onclick="fermerModal()" class="absolute top-4 right-4 bg-gray-200 hover:bg-gray-300 text-gray-700 w-8 h-8 rounded-full flex items-center justify-center font-bold">✕</button>
            <img id="modal-img" src="" alt="Animal" class="w-full h-64 object-cover">
            <div class="p-6">
                <h2 id="modal-nom" class="text-2xl font-bold text-gray-800"></h2>
                <p id="modal-race" class="text-indigo-600 font-medium mb-4"></p>
                <div class="bg-gray-50 p-3 rounded-lg mb-4">
                    <p id="modal-refuge" class="text-gray-700 font-semibold text-sm"></p>
                </div>
                <p id="modal-info" class="text-gray-600 text-sm mb-6"></p>
                <a id="modal-lien" href="#" target="_blank" class="block text-center w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition">
                    Voir l'annonce officielle ↗
                </a>
            </div>
        </div>
    </div>

    <!-- Pied de page avec Copyright -->
    <footer class="bg-gray-800 text-gray-400 py-4 text-center text-xs">
        <p>© 2026 Adopt'SPA - Tous droits réservés. Projet indépendant non officiel.</p>
    </footer>

    <!-- Lien vers le fichier JavaScript -->
    <script src="script.js"></script>
</body>
</html>
